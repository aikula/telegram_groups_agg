version: '3.8'

services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_chat_analytics_bot
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///data/messages.db
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - bot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bot-network:
    driver: bridge
